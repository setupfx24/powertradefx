# Credential-stuffing / brute-force protection on the auth endpoints.
# Trips after 8 failed login/register/OTP/forgot-password POSTs from one IP
# within 10 minutes. Requires cloudflare-real-ip.conf to be installed so the
# logged IP is the actual attacker, not a Cloudflare PoP.
#
# ── Why the Cloudflare action, not the default iptables ban ──────────
# All web traffic arrives from Cloudflare PoP addresses. The real client
# IP only exists in the *log line* (via the real_ip module). The default
# iptables action bans the logged IP — an address that never appears as
# a packet source — so the ban blocked nothing. Banning must happen at
# the Cloudflare edge instead, via their API.
#
# ONE-TIME SETUP (the two cf values below):
#   1. Cloudflare dashboard → My Profile → API Tokens → Create Token →
#      "Account.Firewall Access Rules" edit permission (or use the
#      legacy Global API Key with cfuser=<account email>).
#   2. Fill in cfuser/cftoken below ON THE SERVER after copying this
#      file to /etc/fail2ban/jail.d/ — do NOT commit real credentials
#      to the repo. Until they are set, fail2ban logs a curl error on
#      each ban attempt (same net effect as before: no ban), so this
#      fails no worse than the old config.
#   3. `systemctl restart fail2ban` and test with:
#      fail2ban-client set powertradefx-auth banip 198.51.100.7
#      then check Cloudflare → Security → WAF → Tools → IP Access Rules.
[powertradefx-auth]
enabled  = true
filter   = powertradefx-auth
port     = http,https
logpath  = /var/log/nginx/access.log
maxretry = 8
findtime = 600
bantime  = 3600
# Ban at the Cloudflare edge (fail2ban's bundled action.d/cloudflare.conf).
action   = cloudflare[cfuser="CF_ACCOUNT_EMAIL", cftoken="CF_API_TOKEN"]
