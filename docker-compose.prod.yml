# ============================================================
# PowerTradeFX — Production overrides
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# ============================================================
name: powertradefx

services:
  # ── Infrastructure — restart policy only (no host ports needed) ──
  postgres:
    restart: always

  timescaledb:
    restart: always

  redis:
    restart: always

  # Kafka + Zookeeper + kafka-ui removed (see docker-compose.yml).

  # ── Backend services — restart policy + localhost-only ports ──
  admin-api:
    # !override — compose merges `ports` lists by concatenation, so without
    # it the base file's 0.0.0.0 binding would ALSO be published in prod,
    # exposing the API on the origin IP past Cloudflare/nginx/fail2ban.
    ports: !override
      - "127.0.0.1:8003:8001"
    restart: always
    environment:
      # Admin API is reached exclusively from the admin SPA — never from
      # the trader or marketing domain. Lock CORS to admin.powertradefx.com
      # so a compromise of the other surfaces can't pivot here.
      CORS_ORIGINS: https://admin.powertradefx.com
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8001", "--workers", "2"]

  gateway:
    ports: !override
      - "127.0.0.1:8002:8000"
    restart: always
    environment:
      # /auth/* on the apex now 307s to trade.powertradefx.com (see
      # frontend/trader/src/middleware.ts TRADE_PREFIXES), so credentials
      # are only typed on the trade host — the C1 audit TODO.
      #
      # The apex must STAY in this list for now: CORS_ORIGINS also feeds
      # _check_ws_origin (WS handshake allow-list) and assert_same_origin,
      # and the apex still serves the authenticated app pages (both hosts
      # deliberately serve all pages — see the middleware.ts file header
      # for the RSC/cached-308 incidents that forced that). Dropping the
      # apex here would kill /ws/prices for every apex-hosted session.
      # It can come out only when the apex stops serving app pages.
      CORS_ORIGINS: https://powertradefx.com,https://trade.powertradefx.com,https://admin.powertradefx.com
      COOKIE_DOMAIN: .powertradefx.com
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      # Fills use the same per-user spread the /ws/prices stream shows.
      # Overridable from .env; defaults ON in production.
      USER_SPREAD_AT_EXECUTION: ${USER_SPREAD_AT_EXECUTION:-true}
    command: ["uvicorn", "services.gateway.src.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]

  market-data:
    restart: always

  b-book-engine:
    restart: always

  risk-engine:
    restart: always

  # ── Frontends — build with production domain + restart ──────
  trader-frontend:
    build:
      context: ./frontend/trader
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_VERSION: ${APP_VERSION:-production}
        NEXT_PUBLIC_WS_URL: wss://api.powertradefx.com
        NEXT_PUBLIC_MARKETING_HOST: powertradefx.com
        NEXT_PUBLIC_TRADE_HOST: trade.powertradefx.com
        # Baked into the bundle at build time so the Google Sign-In button can render.
        # Same value as backend GOOGLE_CLIENT_ID. Leave blank to hide the button.
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
        # WalletConnect (Reown Cloud) project id for RainbowKit. Without it,
        # only browser-injected wallets (MetaMask, OKX) work; the WalletConnect
        # mobile-deeplink path (Trust Wallet etc.) is disabled.
        NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID:-}
    ports: !override
      - "127.0.0.1:3012:3000"
    environment:
      INTERNAL_API_URL: http://gateway:8000/api/v1
      TRADER_API_PROXY_TARGET: http://gateway:8000
      # Browser WebSocket connects directly to api subdomain
      NEXT_PUBLIC_WS_URL: wss://api.powertradefx.com
      # Host pair for the marketing/app domain split (read by src/middleware.ts)
      NEXT_PUBLIC_MARKETING_HOST: powertradefx.com
      NEXT_PUBLIC_TRADE_HOST: trade.powertradefx.com
      # DO NOT set NEXT_PUBLIC_GATEWAY_URL — browser uses same-origin /api/v1 proxy (avoids CORS)
    restart: always

  admin-frontend:
    build:
      context: ./frontend/admin
      dockerfile: Dockerfile
    ports: !override
      - "127.0.0.1:3013:3001"
    environment:
      ADMIN_API_PROXY_TARGET: http://admin-api:8001
    restart: always
