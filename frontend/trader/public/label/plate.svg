<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Abstract record plate in amber and teal">
  <defs>
    <radialGradient id="pWarm" cx="34%" cy="30%" r="70%">
      <stop offset="0" stop-color="#E8913C" stop-opacity=".8"/>
      <stop offset="46%" stop-color="#7E4B23" stop-opacity=".36"/>
      <stop offset="100%" stop-color="#0A0C0E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pCool" cx="74%" cy="76%" r="66%">
      <stop offset="0" stop-color="#2E6B72" stop-opacity=".82"/>
      <stop offset="100%" stop-color="#0A0C0E" stop-opacity="0"/>
    </radialGradient>
    <filter id="pGrain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="#0A0C0E"/>
  <rect width="800" height="800" fill="url(#pCool)"/>
  <rect width="800" height="800" fill="url(#pWarm)"/>

  <!-- Grooves -->
  <g fill="none" stroke="#EDE7DC" opacity=".16">
    <circle cx="400" cy="400" r="372" stroke-width="1"/>
    <circle cx="400" cy="400" r="336" stroke-width="1"/>
    <circle cx="400" cy="400" r="300" stroke-width="1"/>
    <circle cx="400" cy="400" r="264" stroke-width="1"/>
    <circle cx="400" cy="400" r="228" stroke-width="1"/>
    <circle cx="400" cy="400" r="192" stroke-width="1"/>
    <circle cx="400" cy="400" r="156" stroke-width="1"/>
  </g>
  <circle cx="400" cy="400" r="120" fill="none" stroke="#E8913C" stroke-width="1.5" opacity=".55"/>
  <circle cx="400" cy="400" r="86" fill="none" stroke="#2E6B72" stroke-width="1.5" opacity=".7"/>
  <circle cx="400" cy="400" r="9" fill="#EDE7DC" opacity=".5"/>

  <rect width="800" height="800" filter="url(#pGrain)" opacity=".2" style="mix-blend-mode:overlay"/>
</svg>
