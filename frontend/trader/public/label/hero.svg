<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Abstract stage photograph in amber and teal">
  <defs>
    <!-- The two page accents live here first; the interface samples them,
         so the UI and the image are guaranteed to agree. -->
    <radialGradient id="warm" cx="66%" cy="26%" r="64%">
      <stop offset="0" stop-color="#E8913C" stop-opacity=".92"/>
      <stop offset="34%" stop-color="#B96C2C" stop-opacity=".52"/>
      <stop offset="72%" stop-color="#3A2413" stop-opacity=".26"/>
      <stop offset="100%" stop-color="#0A0C0E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cool" cx="20%" cy="84%" r="70%">
      <stop offset="0" stop-color="#2E6B72" stop-opacity=".88"/>
      <stop offset="42%" stop-color="#1E4A50" stop-opacity=".46"/>
      <stop offset="100%" stop-color="#0A0C0E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#E8913C" stop-opacity=".34"/>
      <stop offset="100%" stop-color="#E8913C" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A0C0E" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0A0C0E" stop-opacity=".96"/>
    </linearGradient>
    <linearGradient id="figure" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#14181C"/>
      <stop offset="60%" stop-color="#0C0F12"/>
      <stop offset="100%" stop-color="#080A0C"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.86" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="#0A0C0E"/>
  <rect width="1600" height="1000" fill="url(#cool)"/>
  <rect width="1600" height="1000" fill="url(#warm)"/>

  <!-- Light shafts raking across the stage -->
  <g opacity=".5" filter="url(#soft)">
    <polygon points="980,-60 1180,-60 880,1060 640,1060" fill="url(#beam)"/>
    <polygon points="1240,-60 1330,-60 1140,1060 1010,1060" fill="url(#beam)" opacity=".6"/>
  </g>

  <!-- Standing forms, read as silhouettes against the light -->
  <g fill="url(#figure)">
    <path d="M742 1000 V612 a54 54 0 0 1 24-45 l16-11 a46 46 0 1 1 62 0 l17 12 a54 54 0 0 1 23 44 V1000 Z"/>
    <path d="M566 1000 V676 a44 44 0 0 1 20-37 l13-9 a38 38 0 1 1 51 0 l14 10 a44 44 0 0 1 19 36 V1000 Z" opacity=".82"/>
    <path d="M944 1000 V700 a40 40 0 0 1 18-34 l12-8 a35 35 0 1 1 47 0 l13 9 a40 40 0 0 1 17 33 V1000 Z" opacity=".7"/>
  </g>

  <!-- Rim light picking out the near edge of the central form -->
  <g opacity=".62">
    <path d="M884 1000 V612 a54 54 0 0 0-24-45" fill="none" stroke="#E8913C" stroke-width="3" opacity=".8"/>
    <path d="M566 1000 V676 a44 44 0 0 1 20-37" fill="none" stroke="#2E6B72" stroke-width="3" opacity=".85"/>
  </g>

  <!-- Horizon band + floor fall-off -->
  <rect x="0" y="742" width="1600" height="1" fill="#EDE7DC" opacity=".1"/>
  <rect x="0" y="600" width="1600" height="400" fill="url(#floor)"/>

  <!-- Film grain, so the photograph does not read as flat vector -->
  <rect width="1600" height="1000" filter="url(#grain)" opacity=".17" style="mix-blend-mode:overlay"/>
</svg>
